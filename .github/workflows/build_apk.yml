name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - spectradna-max-v3
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    name: Build SpectraDNA MAX v3 BioWave APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: spectradna-max-v3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and verify immutable SpectraDNA v3 source
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          cat spectradna-max-v3/chunks/part*.b64 > /tmp/spectradna-v3.b64
          base64 -d /tmp/spectradna-v3.b64 > /tmp/SpectraDNA-Vault-MAX-v3-BioWave-source.zip
          echo "3375097e5ac37735aed6de3f1fc4dc11892dda52ba7acf340bfdc855dfdb6562  /tmp/SpectraDNA-Vault-MAX-v3-BioWave-source.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/SpectraDNA-Vault-MAX-v3-BioWave-source.zip)" = "55588"
          unzip -t /tmp/SpectraDNA-Vault-MAX-v3-BioWave-source.zip
          unzip -q /tmp/SpectraDNA-Vault-MAX-v3-BioWave-source.zip -d buildsrc
          test -f buildsrc/SpectraDNA-Vault-MAX-v3/settings.gradle

      - name: Run SpectraDNA codec self-tests
        working-directory: buildsrc/SpectraDNA-Vault-MAX-v3
        run: |
          rm -rf core-test-classes
          mkdir core-test-classes
          find app/src/main/java/com/vaan/spectradna -name '*.java' ! -name 'MainActivity.java' > core-files.txt
          javac -d core-test-classes @core-files.txt tools/CodecSelfTest.java tools/WavSelfTest.java tools/BioWaveSelfTest.java
          java -cp core-test-classes CodecSelfTest
          java -cp core-test-classes WavSelfTest
          java -cp core-test-classes BioWaveSelfTest

      - name: Build SpectraDNA debug APK
        working-directory: buildsrc/SpectraDNA-Vault-MAX-v3
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK and checksum
        run: |
          cp buildsrc/SpectraDNA-Vault-MAX-v3/app/build/outputs/apk/debug/app-debug.apk spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave.apk
          sha256sum spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave.apk > spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave-SHA256.txt
          ls -lh spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraDNA-Vault-MAX-v3-BioWave-APK
          path: |
            spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave.apk
            spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave-SHA256.txt
          if-no-files-found: error

      - name: Publish APK back to feature branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave.apk spectradna-max-v3/SpectraDNA-Vault-MAX-v3-BioWave-SHA256.txt
          git commit -m "Build SpectraDNA MAX v3 BioWave APK [skip ci]"
          git push origin HEAD:spectradna-max-v3
