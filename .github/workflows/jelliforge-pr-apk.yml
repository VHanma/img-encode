name: Verify JelliForge APK

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'JelliForge/**'

jobs:
  build-jelliforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: JelliForge
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp JelliForge/app/build/outputs/apk/debug/app-debug.apk JelliForge-v1.1-paint-editor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JelliForge-v1.1-APK
          path: JelliForge-v1.1-paint-editor.apk
          if-no-files-found: error
