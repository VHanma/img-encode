name: Build JelliForge APK

on:
  push:
    branches: [ jelliforge-multi-photo ]
    paths:
      - 'JelliForge/**'
      - '.github/workflows/jelliforge-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: JelliForge
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp JelliForge/app/build/outputs/apk/debug/app-debug.apk JelliForge-v1.3-Rival3.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JelliForge-v1.3-Rival3-APK
          path: JelliForge-v1.3-Rival3.apk
          if-no-files-found: error
