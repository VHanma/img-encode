name: Build Universal Copy Live v3 APK

on:
  push:
    branches:
      - universal-copy-live-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract Universal Copy source
        shell: bash
        run: |
          rm -rf UniversalCopyLive
          unzip -q UniversalCopyLive-source.zip
          test -f UniversalCopyLive/settings.gradle
          test -f UniversalCopyLive/app/build.gradle

      - name: Build debug APK
        working-directory: UniversalCopyLive
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Name APK
        shell: bash
        run: |
          cp UniversalCopyLive/app/build/outputs/apk/debug/app-debug.apk UniversalCopyLive-v3.0-live-debug.apk
          sha256sum UniversalCopyLive-v3.0-live-debug.apk > UniversalCopyLive-v3.0-live-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopyLive-v3.0-APK
          path: |
            UniversalCopyLive-v3.0-live-debug.apk
            UniversalCopyLive-v3.0-live-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
