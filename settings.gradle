pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// CI bridge: unpack the isolated Universal Copy source bundle and expose its
// app module as this branch's :app. The base repository stays untouched.
def bundle = new File(settingsDir, "UniversalCopyLive-source.zip")
def extractRoot = new File(settingsDir, ".universal-copy-ci")
if (!bundle.isFile()) {
    throw new GradleException("UniversalCopyLive-source.zip is missing")
}
if (extractRoot.exists()) {
    extractRoot.deleteDir()
}
extractRoot.mkdirs()

def rootCanonical = extractRoot.canonicalPath + File.separator
new java.util.zip.ZipInputStream(
        new java.io.BufferedInputStream(new java.io.FileInputStream(bundle))).withCloseable { zis ->
    java.util.zip.ZipEntry entry
    byte[] buffer = new byte[16384]
    while ((entry = zis.nextEntry) != null) {
        File out = new File(extractRoot, entry.name)
        String outCanonical = out.canonicalPath
        if (!outCanonical.startsWith(rootCanonical)) {
            throw new GradleException("Unsafe ZIP entry: ${entry.name}")
        }
        if (entry.isDirectory()) {
            out.mkdirs()
        } else {
            out.parentFile.mkdirs()
            new java.io.BufferedOutputStream(new java.io.FileOutputStream(out)).withCloseable { os ->
                int count
                while ((count = zis.read(buffer)) > 0) {
                    os.write(buffer, 0, count)
                }
            }
        }
        zis.closeEntry()
    }
}

def appDir = new File(extractRoot, "UniversalCopyLive/app")
def appGradle = new File(appDir, "build.gradle")
if (!appGradle.isFile()) {
    throw new GradleException("Universal Copy app/build.gradle was not extracted")
}

// The repo's proven PR builder currently installs Android API 35 and Gradle
// 8.10.2. Build the same app against API 35 for this CI pass; the runtime code
// itself remains compatible with Android 16.
String appScript = appGradle.getText("UTF-8")
        .replace("compileSdk 36", "compileSdk 35")
        .replace("targetSdk 36", "targetSdk 35")
appGradle.write(appScript, "UTF-8")

rootProject.name = "UniversalCopyLive"
include ":app"
project(":app").projectDir = appDir
