plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaan.spectradna'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vaan.spectradna'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '3.2.0-compact-exact'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
